---
- name: Update SO
  hosts: all
  become: yes
  gather_facts: no  
  tasks:
    - name: Update node apt
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
        autoclean: yes
        autoremove: yes
    - name: Check if a reboot is needed
      register: reboot_required_file
      stat:
        path: /var/run/reboot-required
        get_md5: no
    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists      

- name: Install packages
  hosts: all 
  become: yes
  gather_facts: yes
  tasks:
    - name: Install vim
      ansible.builtin.apt:
        pkg:
          - vim

    - name: Install curl
      ansible.builtin.apt:
        pkg:
          - curl

    - name: Install nmap
      ansible.builtin.apt:
        pkg:
          - nmap

    - name: Install iptables
      ansible.builtin.apt:
        name: iptables
        state: present

    - name: Install key
      ansible.builtin.apt:
        pkg:        
          - apt-transport-https
          - ca-certificates

    - name: Install Firewall
      ansible.builtin.apt:
        pkg:
          - wireguard

    - name: Add disk nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present
  
    - name: Add disk open-iscsi
      ansible.builtin.apt:
        name: open-iscsi
        state: present
  
    - name: Add disk linux-utils
      ansible.builtin.apt:
        name: util-linux
        state: present
    
    - name: Add disk net-tools
      ansible.builtin.apt:
        name: net-tools
        state: present

    - name: Check if /boot/cmdline.txt exists
      ansible.builtin.stat:
        path: /boot/cmdline.txt
      register: boot_cmdline
    
    - name: Activating cgroup support
      lineinfile:
        path: /boot/cmdline.txt
        regexp: '^((?!.*\bcgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory\b).*)$'
        line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
        backrefs: true
      when: boot_cmdline.stat.exists

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
