---
- name: Update SO
  hosts: all
  become: yes
  gather_facts: no  
  tasks:
    - name: Update node apt
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
        autoclean: yes
        autoremove: yes

    - name: Check if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists      

- name: Install packages
  hosts: all 
  become: yes
  gather_facts: yes
  tasks:
    - name: Install vim
      ansible.builtin.apt:
        pkg:
          - vim

    - name: Install curl
      ansible.builtin.apt:
        pkg:
          - curl

    - name: Install nmap
      ansible.builtin.apt:
        pkg:
          - nmap

    - name: Install iptables
      ansible.builtin.apt:
        name: iptables
        state: present

    - name: Install key
      ansible.builtin.apt:
        pkg:        
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release

    # - name: Install Firewall
    #   ansible.builtin.apt:
    #     pkg:
    #       - wireguard

    - name: Add disk nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present
  
    - name: Add disk open-iscsi
      ansible.builtin.apt:
        name: open-iscsi
        state: present
  
    - name: Add disk linux-utils
      ansible.builtin.apt:
        name: util-linux
        state: present
    - name: Add disk utils
      ansible.builtin.apt:
        name: 
          - cruptsetup
        state: present
    
    - name: Add disk net-tools
      ansible.builtin.apt:
        name: net-tools
        state: present

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker repository signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Install stremio support
      ansible.builtin.apt:
        name:
          - ffmpeg
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups:
          - docker
        append: true

    - name: Check if /boot/cmdline.txt exists
      ansible.builtin.stat:
        path: /boot/cmdline.txt
      register: boot_cmdline
    
    - name: Activating cgroup support
      lineinfile:
        path: /boot/cmdline.txt
        regexp: '^((?!.*\bcgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory\b).*)$'
        line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
        backrefs: true
      when: boot_cmdline.stat.exists

    - name: Check if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists  