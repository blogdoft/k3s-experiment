apiVersion: v1
kind: Secret
metadata:
  name: grafana-alerting-contactpoints
  namespace: observability
type: Opaque
stringData:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: telegram
        receivers:
          - uid: telegram-main
            type: telegram
            settings:
              bottoken: "${TELEGRAM_BOT_TOKEN}"
              chatid: "${TELEGRAM_CHAT_ID}"
              parse_mode: None
