apiVersion: v1
kind: Secret
metadata:
  name: repo-k3s-apps
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  url: git@github.com:blogdoft/k3s-apps.git
  sshPrivateKey: |
    # Do NOT commit private keys in this repository.
    # Generate a filled version locally with:
    #   ./argocd/generate-repo-secret.sh
    # It will create `argocd/repo-secret.generated.yaml` with your key content.
    __REPLACE_WITH_YOUR_PRIVATE_KEY__
