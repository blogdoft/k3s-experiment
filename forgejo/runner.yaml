# Secret data.
# You will need to retrieve this from the web UI, and your Forgejo instance must be running v1.21+
# Alternatively, create this with
# kubectl create secret generic runner-secret --from-literal=token=your_offline_token_here
apiVersion: v1
kind: Secret
metadata:
  name: runner-secret
  namespace: forgejo
stringData:
  token: $RUNNER_TOKEN # Replace with your Forgejo offline registration token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
    app.kubernetes.io/component: forgejo-runner
    app.kubernetes.io/instance: forgejo-runner
    app.kubernetes.io/managed-by: Kustomize
    app.kubernetes.io/name: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      name: forgejo-runner
      labels:
        app: forgejo-runner
        app.kubernetes.io/component: forgejo-runner
        app.kubernetes.io/instance: forgejo-runner
        app.kubernetes.io/managed-by: Kustomize
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.1.0
          command:
            - /bin/bash
            - -c
          args:
            - |
              child=""
              _term() {
                echo "Caught TERM/INT, forwarding to forgejo-runner..." ;
                [ -n "$child" ] && kill -TERM "$child" 2>/dev/null ;
                wait "$child" 2>/dev/null ;
                exit 0 ;
              }
              trap _term TERM INT
              while ! nc -z localhost 2376 </dev/null ; do
                echo 'waiting for docker daemon...' ;
                sleep 5 ;
                done ;
              while : ; do
                rm -f /data/config.yml /data/.runner
                while : ; do
                  forgejo-runner register --no-interactive --ephemeral --token $(RUNNER_SECRET) --name "$(RUNNER_NAME)-$RANDOM" --instance $(FORGEJO_INSTANCE_URL) && break ;
                  sleep 1 ;
                done ;
                forgejo-runner generate-config > /data/config.yml ;
                sed -i -e "s|insecure: false|insecure: true|" /data/config.yml
                sed -i -e "s|network: .*|network: host|" /data/config.yml ;
                sed -i -e "s|^  labels: \[\]$|  labels: \[\"ubuntu:docker://docker.io/library/node:lts\"\]|" /data/config.yml
                sed -i -e "s|^  envs:$$|  envs:\n    DOCKER_HOST: tcp://localhost:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|" /data/config.yml ;
                sed -i -e "s|^  options:|  options: -v /certs/client:/certs/client|" /data/config.yml ;
                sed -i -e "s|  valid_volumes: \[\]$$|  valid_volumes:\n    - /certs/client|" /data/config.yml
                forgejo-runner --config /data/config.yml one-job --wait &
                child=$! ;
                wait "$child" ;
                child="" ;
              done
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-secret
                  key: token
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo.forgejo.svc.cluster.local:3000 # Replace with your Forgejo instance URL
              # value: https://forgejo.home.arpa # Replace with your Forgejo instance URL
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: '1'
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 3Gi
              memory: 4Gi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: runner-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - name: daemon
          image: docker.io/docker:28.3.0-dind
          command:
            - dockerd-entrypoint.sh
          args:
            - --insecure-registry=forgejo.forgejo.svc.cluster.local:3000
            - --insecure-registry=forgejo.home.arpa
            - --insecure-registry=docker-registry-mirror.forgejo.svc.cluster.local:5000
            - --registry-mirror=http://docker-registry-mirror.forgejo.svc.cluster.local:5000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 3Gi
              memory: 4Gi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
