# Secret data.
# You will need to retrieve this from the web UI, and your Forgejo instance must be running v1.21+
# Alternatively, create this with
# kubectl create secret generic runner-secret --from-literal=token=your_offline_token_here
apiVersion: v1
kind: Secret
metadata:
  name: runner-secret
  namespace: forgejo
stringData:
  token-host: $RUNNER_TOKEN # Replace with your Forgejo offline registration token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner-host
  namespace: forgejo
  labels:
    app: forgejo-runner-host
    app.kubernetes.io/component: forgejo-runner-host
    app.kubernetes.io/instance: forgejo-runner-host
    app.kubernetes.io/managed-by: Kustomize
    app.kubernetes.io/name: forgejo-runner-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner-host
  template:
    metadata:
      name: forgejo-runner-host
      labels:
        app: forgejo-runner-host
        app.kubernetes.io/component: forgejo-runner-host
        app.kubernetes.io/instance: forgejo-runner-host
        app.kubernetes.io/managed-by: Kustomize
        app.kubernetes.io/name: forgejo-runner-host
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      initContainers:
        - name: runner-register-host
          image: code.forgejo.org/forgejo/runner:6.4.0
          command:
            - /bin/bash
            - -c
          args:
            - |
              cd /data
              while : ; do
                forgejo-runner register --no-interactive --token $(RUNNER_SECRET) --name $(RUNNER_NAME) --instance $(FORGEJO_INSTANCE_URL) && break ;
                sleep 1 ;
              done ;
              forgejo-runner generate-config > /data/config.yml ;
              sed -i -e "s|insecure: false|insecure: true|" /data/config.yml
              sed -i -e "s|network: .*|network: host|" /data/config.yml ;
              sed -i -e "s|^  options:|  options: -v /var/run/docker.sock:/var/run/docker.sock|" /data/config.yml
              sed -i -e "s|^  labels: \[\]$|  labels: \[\"self-hosted:host\"\]|" /data/config.yml
              sed -i -e "s|  valid_volumes: \[\]$|  valid_volumes:\n    - /var/run/docker.sock|" /data/config.yml
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-secret
                  key: token-host
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo.forgejo.svc.cluster.local:3000 # Replace with your Forgejo instance URL
          resources:
            limits:
              cpu: '0.5'
              ephemeral-storage: 100Mi
              memory: 64Mi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
          volumeMounts:
            - name: runner-data-host
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.4.0
          command:
            - /bin/bash
            - -c
          args: 
            - |
              cd /data
              forgejo-runner --config /data/config.yml daemon
          env:
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo.forgejo.svc.cluster.local:3000
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-secret
                  key: token-host
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - name: runner-data-host
              mountPath: /data
            - name: docker-sock-host
              mountPath: /var/run/docker.sock
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0          
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 3Gi
              memory: 4Gi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
      volumes:
        - name: runner-data-host
          emptyDir: {}
        - name: docker-sock-host
          hostPath:
            path: /var/run/docker.sock
            type: Socket
